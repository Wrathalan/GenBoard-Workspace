name: Build and publish Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag matching package.json
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify version and release notes
        run: node scripts/release.mjs check
      - name: Test release automation
        run: node --test tests/release-automation.test.mjs
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright test
      - run: node tests/browser.integration.mjs
      - run: npm run package -- --publish never
      - name: Verify update assets and write checksum
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $installer = "Weave.Setup.$version.exe"
          foreach ($file in @($installer, "$installer.blockmap", 'latest.yml')) {
            if (!(Test-Path -LiteralPath "release/$file")) { throw "Missing release asset: $file" }
          }
          $hash = (Get-FileHash -LiteralPath "release/$installer" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $installer" | Set-Content -LiteralPath release/SHA256SUMS.txt -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v4
        with:
          name: weave-windows-release
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
      - name: Publish verified release
        run: node scripts/release.mjs publish
        env:
          GH_TOKEN: ${{ github.token }}
  announce:
    needs: windows
    uses: ./.github/workflows/announce-release.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets: inherit
